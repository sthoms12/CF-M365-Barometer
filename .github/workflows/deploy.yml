name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run types
      - run: npm run build

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$INGEST_TOKEN"
          test -n "$WORKER_GITHUB_TOKEN"

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "m365-barometer") | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create m365-barometer
            database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "m365-barometer") | .uuid' | head -n 1)"
          fi
          test -n "$database_id"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Render production configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: npm run config:production

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply m365-barometer --remote --config wrangler.production.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Configure Worker secrets
        shell: bash
        run: |
          printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN --config wrangler.production.jsonc
          printf '%s' "$WORKER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.production.jsonc

      - name: Smoke test
        shell: bash
        run: |
          # The public URL can't be curled from GitHub runners: the zone's bot
          # protection 403s automated datacenter traffic. Instead, verify via
          # the Cloudflare API that this run's deployment actually landed.
          # NOTE: GET on a single script returns its source as multipart, not
          # JSON, so use the list endpoint and pick out our worker's metadata.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          body="$(mktemp)"
          code="$(curl --silent --show-error --write-out '%{http_code}' --output "$body" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" "$api")"
          echo "Cloudflare API -> HTTP $code, $(wc -c < "$body") bytes"
          if [ "$code" != 200 ]; then
            echo "--- response head ---"; head -c 600 "$body"; echo; echo "--- end ---"
            exit 1
          fi
          if ! jq -e . >/dev/null < "$body"; then
            echo "--- non-JSON response head ---"; head -c 600 "$body"; echo; echo "--- end ---"
            exit 1
          fi
          modified_on="$(jq -r '.result[] | select(.id=="m365-barometer") | .modified_on // empty' "$body")"
          echo "Worker m365-barometer last modified: $modified_on"
          [ -n "$modified_on" ] || { echo "missing modified_on in API response"; exit 1; }
          age_minutes="$(( ($(date +%s) - $(date -d "$modified_on" +%s)) / 60 ))"
          echo "Deployment age: ${age_minutes}m"
          test "$age_minutes" -lt 15
